[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --protected-mode no --maxmemory 32mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kafka]
# Optimized Low RAM Kafka: 96MB Heap, Serial GC
# Increased from 64MB to 96MB to handle health check overhead from Render
command=/opt/kafka/bin/kafka-server-start.sh /app/kafka-server.properties
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=KAFKA_HEAP_OPTS="-Xmx96M -Xms96M",KAFKA_JVM_PERFORMANCE_OPTS="-server -XX:+UseSerialGC -Djava.awt.headless=true"

[program:spring-boot]
# Aggressive Memory Tuning for 512MB RAM
# Heap: 160MB, Metaspace: 80MB, Stack: 256k, CodeCache: 32M
# Added MaxDirectMemorySize to prevent native memory bloat
command=java -Xmx160M -Xms128M -Xss256k -XX:+UseSerialGC -XX:MaxMetaspaceSize=80M -XX:MaxDirectMemorySize=16M -XX:ReservedCodeCacheSize=32M -Dserver.port=%(ENV_PORT)s -Dspring.profiles.active=prod -jar /app/app.jar
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
