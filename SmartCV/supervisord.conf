[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --protected-mode no --maxmemory 64mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:spring-boot]
# Optimized for 512MB RAM without Kafka
# Heap: 300MB, Metaspace: 96MB, Stack: 256k
command=java -Xmx300M -Xms128M -Xss256k -XX:+UseSerialGC -XX:MaxMetaspaceSize=96M -XX:MaxDirectMemorySize=32M -XX:ReservedCodeCacheSize=64M -Dserver.port=%(ENV_PORT)s -Dspring.profiles.active=prod -jar /app/app.jar
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
