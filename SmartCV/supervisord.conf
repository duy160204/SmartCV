[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --protected-mode no --maxmemory 48mb --maxmemory-policy allkeys-lru --appendonly no --save ""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:spring-boot]
# Safe config for 512MB: 200MB Heap + ~150MB Non-Heap + 48MB Redis + OS = ~500MB
command=java -Xmx200M -Xms128M -Xss256k -XX:+UseSerialGC -XX:MaxMetaspaceSize=80M -XX:MaxDirectMemorySize=16M -XX:ReservedCodeCacheSize=48M -Dserver.port=%(ENV_PORT)s -Dspring.profiles.active=prod -jar /app/app.jar
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
