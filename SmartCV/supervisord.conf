[supervisord]
nodaemon=true
user=root
logfile=/app/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --protected-mode no
autostart=true
autorestart=true
stdout_logfile=/app/redis.log
stderr_logfile=/app/redis.err.log

[program:kafka]
command=/opt/kafka/bin/kafka-server-start.sh /app/kafka-server.properties
autostart=true
autorestart=true
stdout_logfile=/app/kafka.log
stderr_logfile=/app/kafka.err.log
environment=KAFKA_HEAP_OPTS="-Xmx256M -Xms128M"

[program:spring-boot]
command=java -Xmx512M -Xms256M -Dserver.port=%(ENV_PORT)s -Dspring.profiles.active=prod -jar /app/app.jar
autostart=true
autorestart=true
stdout_logfile=/app/spring.log
stderr_logfile=/app/spring.err.log
priority=100
