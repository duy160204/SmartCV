[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --protected-mode no --maxmemory 32mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kafka]
# Extreme Low RAM Kafka: 64MB Heap, Serial GC, Limited Metaspace
command=/opt/kafka/bin/kafka-server-start.sh /app/kafka-server.properties
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=KAFKA_HEAP_OPTS="-Xmx64M -Xms64M -XX:+UseSerialGC -XX:MaxMetaspaceSize=64M"

[program:spring-boot]
# Extreme Low RAM Spring: 192MB Heap, Serial GC, Small Stack, Limited Metaspace
# Reducing to 192MB to ensure we stay under 512MB total
command=java -Xmx192M -Xms128M -Xss256k -XX:+UseSerialGC -XX:MaxMetaspaceSize=96M -Dserver.port=%(ENV_PORT)s -Dspring.profiles.active=prod -jar /app/app.jar
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
