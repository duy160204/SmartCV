# Use H2 in-memory database for fast, self-contained tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Minimize Hikari CP overhead during test suite run
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# Storage, limits, and security
app.storage.preview-dir=./test-preview-storage/
app.ai.free-plan-daily-limit=50
app.ai.rate-limit-per-minute=10
app.ai.rate-limit-capacity=15
app.security.cookie-secure=false

# App base URLs placeholders
app.backend.url=http://localhost:8080
app.frontend.url=http://localhost:3000
app.admin.url=http://localhost:3001
app.pdf-service.url=http://localhost:3002/render-pdf
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
app.public-cv-url=http://localhost:3000

# Core integrations property keys
ai.openai.enabled=true
ai.openai.api-key=dummy-key
ai.openai.base-url=http://localhost
ai.openai.model=gpt-4o-mini
ai.provider.primary=OPENAI
ai.provider.timeout=10000

# OAuth Client standard registration placeholders
spring.security.oauth2.client.registration.google.client-id=dummy-id
spring.security.oauth2.client.registration.google.client-secret=dummy-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost/api/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=dummy-id
spring.security.oauth2.client.registration.github.client-secret=dummy-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost/api/login/oauth2/code/github

spring.security.oauth2.client.registration.facebook.client-id=dummy-id
spring.security.oauth2.client.registration.facebook.client-secret=dummy-secret
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri=http://localhost/api/login/oauth2/code/facebook

# LinkedIn Custom OAuth Provider test configuration
spring.security.oauth2.client.registration.linkedin.client-id=dummy-id
spring.security.oauth2.client.registration.linkedin.client-secret=dummy-secret
spring.security.oauth2.client.registration.linkedin.scope=openid,profile,email
spring.security.oauth2.client.registration.linkedin.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.redirect-uri=http://localhost/api/login/oauth2/code/linkedin

spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/userinfo
spring.security.oauth2.client.provider.linkedin.user-name-attribute=sub

# Manual OAuth Zalo placeholders
oauth.zalo.client-id=dummy-id
oauth.zalo.client-secret=dummy-secret
oauth.zalo.redirect-uri=http://localhost
oauth.zalo.scope=basic

# SMTP config placeholders
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=dummy-user
spring.mail.password=dummy-pass

# VNPay config placeholders
vnpay.tmn-code=dummy
vnpay.hash-secret=dummy
vnpay.pay-url=http://localhost
vnpay.return-url=http://localhost
vnpay.ipn-url=http://localhost

# JWT config placeholders
jwt.secret=very_long_dummy_secret_for_startup_validation_12345
jwt.expiration-ms=86400000

# Stripe config placeholders
stripe.api-key=dummy
stripe.webhook-secret=dummy
