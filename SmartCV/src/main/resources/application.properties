# ===================== Ứng dụng và server =====================
spring.application.name=SmartCV
server.port=${PORT:8080}
server.address=0.0.0.0

# Mặc định dùng profile local, có thể override bằng SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================== MySQL =====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/SmartCV?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing_Production_Schema
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=false

# Prevent warning "Cannot deserialize session attribute" on devtools restart
server.servlet.session.persistent=false

# ===================== OPENAI =====================
ai.openai.enabled=true
ai.openai.api-key=${OPENAI_API_KEY}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

ai.provider.primary=OPENAI
ai.provider.timeout=10000

# ===================== AI QUOTA =====================
app.ai.free-plan-daily-limit=50
app.ai.rate-limit-per-minute=10
app.ai.rate-limit-capacity=15

# ===================== APP BASE URLS (CRITICAL FOR PROD) =====================
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.admin.url=${APP_ADMIN_URL:http://localhost:3001}
app.pdf-service.url=${APP_PDF_SERVICE_URL:http://localhost:3002/render-pdf}

# CORS - Comma separated list of origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend.url},${app.admin.url}}

# ===================== STANDARD SPRING OAUTH2 =====================
# Google
spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend.url}/api/login/oauth2/code/google

# GitHub
spring.security.oauth2.client.registration.github.client-id=${OAUTH_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${app.backend.url}/api/login/oauth2/code/github

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${OAUTH_FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH_FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri=${app.backend.url}/api/login/oauth2/code/facebook

# LinkedIn (Custom Provider)
spring.security.oauth2.client.registration.linkedin.client-id=${OAUTH_LINKEDIN_CLIENT_ID}
spring.security.oauth2.client.registration.linkedin.client-secret=${OAUTH_LINKEDIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.linkedin.scope=openid,profile,email
spring.security.oauth2.client.registration.linkedin.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.redirect-uri=${app.backend.url}/api/login/oauth2/code/linkedin
spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/userinfo
spring.security.oauth2.client.provider.linkedin.user-name-attribute=sub

# ===================== MANUAL OAUTH (ZALO ONLY) =====================
oauth.zalo.client-id=${OAUTH_ZALO_CLIENT_ID}
oauth.zalo.client-secret=${OAUTH_ZALO_CLIENT_SECRET}
oauth.zalo.redirect-uri=${app.backend.url}/auth/oauth/zalo/callback
oauth.zalo.scope=basic

# ===================== MAIL (SMTP) =====================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================== VNPAY =====================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${app.backend.url}/api/payments/vnpay/return
vnpay.ipn-url=${VNPAY_IPN_URL}

# ===================== JWT =====================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Cookie secure flag (false for dev, true for prod via env)
app.security.cookie-secure=${APP_COOKIE_SECURE:false}

# ===================== STRIPE =====================
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ===================== PUBLIC CV =====================
app.public-cv-url=${APP_PUBLIC_CV_URL:http://localhost:3000}

# ===================== CORS =====================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ===================== FILE UPLOAD =====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================== PREVIEW STORAGE =====================
app.storage.preview-dir=${APP_STORAGE_DIR:./preview-storage/}

# ===================== REDIS =====================
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.repositories.enabled=false

# ===================== MANAGEMENT / HEALTH =====================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
