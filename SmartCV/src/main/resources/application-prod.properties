# ===================== REDIS (LOCALHOST SIDE-CAR) =====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.cache.type=redis

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Tăng tốc độ startup kết nối DB từ xa
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.data.jpa.repositories.bootstrap-mode=deferred

# ===================== LOGGING =====================
# Kafka logs are no longer needed
logging.level.com.example.SmartCV=INFO
logging.level.org.springframework.data.redis=INFO

# App specific settings
app.ai.free-plan-daily-limit=50

# ===================== PERFORMANCE TUNING =====================
# Ép Spring Boot khởi tạo các bean trễ (khi có request đầu tiên)
# Giảm thiểu thời gian startup để vượt qua Render Health Check
spring.main.lazy-initialization=true
