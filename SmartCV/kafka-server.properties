# Kafka KRaft Configuration - ULTIMATE LOW RAM MODE (512MB Host)
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Resource Constraints - Aggressive
num.network.threads=1
num.io.threads=1
queued.max.requests=10
socket.send.buffer.bytes=65536
socket.receive.buffer.bytes=65536
socket.request.max.bytes=1048576
log.dirs=/app/kafka-logs
num.partitions=1
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Log Management
log.retention.hours=1
log.segment.bytes=5242880
log.retention.check.interval.ms=60000
log.cleaner.enable=false

# Controller Config
controller.quota.window.num=2
controller.quota.window.size.seconds=1
